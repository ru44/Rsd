server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/octet-stream;

    # Imported files are sent to the API as JSON and can be large.
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://backend:7000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # File names with a content hash never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The app's own pages all start from index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
